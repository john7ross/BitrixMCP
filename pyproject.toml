[project]
name = "bitrix-mcp"
version = "0.1.0"
description = "Universal, full-featured, portable MCP server for the Bitrix24 REST API (CRM, tasks, scrum, calendar, disk, users, messaging) — read and write."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergey Lebedev" }]
keywords = ["mcp", "bitrix24", "bitrix", "crm", "rest", "model-context-protocol"]
dependencies = [
    "httpx>=0.27",
    # 2.x only: the server is built on `mcp.server.mcpserver`, which does not
    # exist in 1.x. The lower bound is the API, not a preference.
    "mcp[cli]>=2",
    # Imported directly at module level by every tool module (Field annotations),
    # so it is a real dependency of ours - not something to inherit from mcp and
    # hope stays there.
    "pydantic>=2.0",
    # Only the HTTP transport needs these, and both are imported lazily so stdio
    # never pays for them. Declared anyway: `--http` is a documented, supported
    # mode, and relying on mcp[cli] to keep pulling them is an assumption that
    # would fail as a runtime ImportError rather than at install time.
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/john7ross/BitrixMCP"
Repository = "https://github.com/john7ross/BitrixMCP"
Issues = "https://github.com/john7ross/BitrixMCP/issues"
Changelog = "https://github.com/john7ross/BitrixMCP/releases"

[project.scripts]
bitrix-mcp = "bitrix_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitrix_mcp"]
# The REST method catalog is data, not code, and the discovery tools are useless
# without it - state the include explicitly rather than relying on the backend's
# default file collection.
artifacts = ["src/bitrix_mcp/data/catalog.json"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "*.md", "LICENSE"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
